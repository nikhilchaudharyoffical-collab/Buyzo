openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Storefront product and checkout operations
  - name: admin
    description: Admin inventory, order, and analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: List storefront products
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
  /orders:
    get:
      operationId: listOrders
      tags: [admin]
      summary: List orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [storefront]
      summary: Place a customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    patch:
      operationId: updateOrder
      tags: [admin]
      summary: Update order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [admin]
      summary: Get dashboard analytics
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
  /analytics/events:
    post:
      operationId: trackAnalyticsEvent
      tags: [storefront]
      summary: Track a storefront event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "204":
          description: Event recorded
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, description, price, compareAtPrice, rating, reviewCount, stock, images, highlights]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        price: { type: number }
        compareAtPrice: { type: number }
        rating: { type: number }
        reviewCount: { type: integer }
        stock: { type: integer }
        images:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { type: string }
    ProductInput:
      type: object
      required: [name, category, description, price, compareAtPrice, rating, reviewCount, stock, images, highlights]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: number, minimum: 0 }
        rating: { type: number, minimum: 0, maximum: 5 }
        reviewCount: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        images:
          type: array
          items: { type: string, format: uri }
        highlights:
          type: array
          items: { type: string }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: number, minimum: 0 }
        rating: { type: number, minimum: 0, maximum: 5 }
        reviewCount: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        images:
          type: array
          items: { type: string, format: uri }
        highlights:
          type: array
          items: { type: string }
    Order:
      type: object
      required: [id, productId, productName, quantity, total, paymentMethod, status, deliveryDate, createdAt, customerName, customerContact, address]
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        total: { type: number }
        paymentMethod: { type: string, enum: [COD, UPI] }
        status: { type: string, enum: [Processing, Confirmed, Shipped, Delivered, Cancelled] }
        deliveryDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        customerName: { type: string }
        customerContact: { type: string }
        address: { type: string }
    OrderInput:
      type: object
      required: [productId, productName, quantity, total, paymentMethod, deliveryDate, customerName, customerContact, address]
      properties:
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        total: { type: number, minimum: 0 }
        paymentMethod: { type: string, enum: [COD, UPI] }
        deliveryDate: { type: string, format: date }
        customerName: { type: string, minLength: 1 }
        customerContact: { type: string, minLength: 3 }
        address: { type: string, minLength: 5 }
    OrderUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Processing, Confirmed, Shipped, Delivered, Cancelled] }
    AnalyticsSummary:
      type: object
      required: [visits, productClicks, orders, revenue, conversionRate, daily]
      properties:
        visits: { type: integer }
        productClicks: { type: integer }
        orders: { type: integer }
        revenue: { type: number }
        conversionRate: { type: number }
        daily:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDay"
    AnalyticsDay:
      type: object
      required: [label, visits, clicks, orders]
      properties:
        label: { type: string }
        visits: { type: integer }
        clicks: { type: integer }
        orders: { type: integer }
    AnalyticsEventInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [visit, click, buy] }
        productId: { type: ["string", "null"] }

